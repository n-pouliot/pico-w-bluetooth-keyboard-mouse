name: Host tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: host-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S tests -B build-host-tests -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-host-tests --config Release

      - name: Test
        run: ctest --test-dir build-host-tests -C Release --output-on-failure
